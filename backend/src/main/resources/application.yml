server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/meters}
    username: ${DATABASE_USERNAME:meters}
    password: ${DATABASE_PASSWORD:meters}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_SIZE:10MB}

management.endpoints.web.exposure.include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZHVjdGlvbg==}
    expiration: ${JWT_EXPIRATION:PT8H}
  reading:
    maximum-value: ${READING_MAXIMUM:999999999.999999}
    future-tolerance: PT5M
    duplicate-tolerance: 0.000001
  upload:
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
    maximum-bytes: ${UPLOAD_MAX_BYTES:10485760}
    allowed-mime-types: [image/jpeg, image/png, image/webp, image/tiff]
    retention: ${UPLOAD_RETENTION:P30D}
  ocr:
    engine: ${APP_OCR_ENGINE:tesseract}
    minimum-confidence: ${OCR_MINIMUM_CONFIDENCE:0.80}
    tessdata-path: ${TESSDATA_PATH:}
    digit-model-path: ${OCR_DIGIT_MODEL_PATH:../work/ocr-training/digit-cells/best_digit_model.pt}
    digit-predict-script: ${OCR_DIGIT_PREDICT_SCRIPT:../ml/predict_full_meter.py}
    python-executable: ${OCR_PYTHON_EXECUTABLE:python}
    worker-enabled: ${OCR_WORKER_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
