services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meters
      POSTGRES_USER: meters
      POSTGRES_PASSWORD: meters
    ports:
      - "5434:5432"
    volumes:
      - meter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meters -d meters"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  meter-postgres:
